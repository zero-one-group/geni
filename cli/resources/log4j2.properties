# The Geni CLI's logging config. The uberjar carries it in place of Spark's
# default profile: Spark's log4j2-defaults.properties at WARN, as spark-shell
# logs, without two warnings that ask nothing of the user.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# As in Spark's defaults.
logger.jetty.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty.level = error
logger.parquet.name = org.apache.parquet.CorruptStatistics
logger.parquet.level = error

# Spark 3.5 doesn't know JDK 21's G1 Concurrent GC, and says so from its
# metrics poller a few seconds in, over the REPL prompt.
logger.gc.name = org.apache.spark.metrics.GarbageCollectionMetrics
logger.gc.level = error

# Hadoop's native library is optional, and Spark doesn't ship it.
logger.hadoop.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop.level = error
