name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: lint-${{ hashFiles('deps.edn') }}
      - run: clojure -T:build lint

  # Every run: Spark 3.5 on Scala 2.12 and Spark 4, on JDK 21, in two shards
  # each, plus the main alias on arm64 (the closest match to Apple Silicon).
  test:
    name: test (${{ matrix.spark }}, JDK 21, ${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        spark: [spark, spark-4]
        shard: [1, 2]
        include:
          - {os: ubuntu-24.04-arm, spark: spark, shard: 1}
          - {os: ubuntu-24.04-arm, spark: spark, shard: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          spark: ${{ matrix.spark }}
          shard: ${{ matrix.shard }}
          shards: 2

  # Pushes to develop and manual runs also cover JDK 17 and Spark 3.5 on
  # Scala 2.13.
  test-more:
    if: github.event_name != 'pull_request'
    name: test (${{ matrix.spark }}, JDK ${{ matrix.java }}, ubuntu-latest, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        spark: [spark, spark-3.5-2.13, spark-4]
        shard: [1, 2]
        exclude:
          - {java: 21, spark: spark}
          - {java: 21, spark: spark-4}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          java: ${{ matrix.java }}
          spark: ${{ matrix.spark }}
          shard: ${{ matrix.shard }}
          shards: 2

  # The examples in the README and docs/, run as tests on :spark. Generated
  # assertions allow small floating-point differences between numerical backends.
  docs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: docs-${{ hashFiles('deps.edn') }}
          restore-keys: deps-spark-
      - run: clojure -T:build prep
      - run: clojure -T:build docs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-docs
          path: target/test.log

  # The only required check, so that the matrix can change without touching
  # the branch rule.
  ci:
    if: always()
    needs: [lint, test, test-more, docs]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
