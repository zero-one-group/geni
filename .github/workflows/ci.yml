name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: lint-${{ hashFiles('deps.edn') }}
      - run: clojure -T:build lint

  # Every run: Spark 3.5 on Scala 2.12 and Spark 4, on JDK 21, in two shards
  # each, plus the main alias on arm64 (the closest match to Apple Silicon).
  test:
    name: test (${{ matrix.spark }}, JDK 21, ${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        spark: [spark, spark-4]
        shard: [1, 2]
        include:
          - {os: ubuntu-24.04-arm, spark: spark, shard: 1}
          - {os: ubuntu-24.04-arm, spark: spark, shard: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          spark: ${{ matrix.spark }}
          shard: ${{ matrix.shard }}
          shards: 2

  # Pushes to develop and manual runs also cover JDK 17 and Spark 3.5 on
  # Scala 2.13.
  test-more:
    if: github.event_name != 'pull_request'
    name: test (${{ matrix.spark }}, JDK ${{ matrix.java }}, ubuntu-latest, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        spark: [spark, spark-3.5-2.13, spark-4]
        shard: [1, 2]
        exclude:
          - {java: 21, spark: spark}
          - {java: 21, spark: spark-4}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test
        with:
          java: ${{ matrix.java }}
          spark: ${{ matrix.spark }}
          shard: ${{ matrix.shard }}
          shards: 2

  # The suite over Spark Connect: a Spark Connect server on :spark-4 in the
  # background, and the tests with Spark's JVM client in place of classic
  # Spark, which skip the ones marked ^:classic.
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: connect-${{ hashFiles('deps.edn') }}
          restore-keys: deps-spark-4-
      - run: clojure -P -T:build
      - run: clojure -P -X:spark-4:test:connect-server
      - run: clojure -P -X:spark-connect:test:tmd:connect-arrow
      - run: clojure -T:build prep :spark :spark-4
      - run: clojure -T:build connect-tests
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-connect
          path: |
            target/test.log
            target/connect-server.log

  # The XGBoost tests and the XGBoost guide's examples, with XGBoost4J-Spark 3:
  # Spark 3.5 on x64 and arm64 (the closest match to Apple Silicon), and
  # Spark 4.
  xgboost:
    name: xgboost (${{ matrix.spark }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, spark: spark, xgb: xgb}
          - {os: ubuntu-24.04-arm, spark: spark, xgb: xgb}
          - {os: ubuntu-latest, spark: spark-4, xgb: xgb-2.13}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: xgb-${{ matrix.spark }}-${{ runner.arch }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ matrix.spark }}-
      - run: clojure -P -T:build
      - run: clojure -P -X:${{ matrix.spark }}:test:${{ matrix.xgb }}:xgb-docs
      - run: clojure -P -X:gen-doc-tests
      - run: clojure -T:build prep :spark :${{ matrix.spark }}
      - run: clojure -T:build xgb-tests :spark :${{ matrix.spark }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-xgboost-${{ matrix.spark }}-${{ runner.arch }}
          path: target/test.log

  # The examples in the README and docs/, run as tests on :spark. Generated
  # assertions allow small floating-point differences between numerical backends.
  docs:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: docs-${{ hashFiles('deps.edn') }}
          restore-keys: deps-spark-
      - run: clojure -T:build prep
      - run: clojure -T:build docs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-docs
          path: target/test.log

  # The library jar as users get it: installed into ~/.m2, then used from the
  # README's deps.edn on Clojure 1.11.4 and JDK 17, the oldest that Geni
  # supports. The tests run on Clojure 1.12, from the source tree.
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            !~/.m2/repository/zero/one/geni
          key: jar-${{ hashFiles('deps.edn') }}
          restore-keys: deps-spark-
      - run: clojure -T:build install
      - name: Check what the jar holds
        run: |
          version=$(sed -n 's/^(def version "\(.*\)")$/\1/p' build.clj)
          contents=$(unzip -l "target/geni-$version.jar")
          grep -q ' spark-docs.edn$' <<< "$contents"
          grep -q ' zero_one/geni/rdd/function/Fn1.class$' <<< "$contents"
          # The version file is for scripts/geni, and the CLI is the uberjar's.
          if grep -q 'GENI_REPL_RELEASED_VERSION\|zero_one/geni/main' <<< "$contents"; then
            echo "The jar holds files that it shouldn't."
            exit 1
          fi
          # The pom lists Spark for cljdoc, as an optional dep.
          unzip -p "target/geni-$version.jar" META-INF/maven/zero.one/geni/pom.xml | grep -q spark-sql_2.12
      - name: Use the jar from the README, on Clojure 1.11.4
        run: |
          mkdir smoke
          cd smoke
          # The README's first deps.edn, with zero.one/geni and the :spark alias.
          awk '/^```edn$/ && !n++ {f=1; next} f && /^```$/ {exit} f' ../README.md > deps.edn
          clojure_1_11='{:deps {org.clojure/clojure {:mvn/version "1.11.4"}}}'
          # Without :spark, no Spark comes through the pom.
          classpath=$(clojure -Sdeps "$clojure_1_11" -Spath)
          if grep -q /org/apache/spark/ <<< "$classpath"; then
            echo "Spark came through the pom: $classpath"
            exit 1
          fi
          cat > smoke.clj <<'CLJ'
          (require '[zero-one.geni.core :as g]
                   '[zero-one.geni.ml :as ml]
                   '[zero-one.geni.rdd :as rdd])

          (assert (= "1.11.4" (clojure-version)) (clojure-version))
          (let [df     (g/table->dataset [["a b"] ["c"]] [:text])
                tokens (ml/transform df (ml/tokenizer {:input-col :text :output-col :words}))]
            (assert (= [["a" "b"] ["c"]] (map first (g/collect-vals (g/select tokens :words))))))
          (assert (= 3 (rdd/count (rdd/parallelise [1 2 3]))))
          (println "The jar works on Clojure" (clojure-version))
          (System/exit 0)
          CLJ
          clojure -Sdeps "$clojure_1_11" -M:spark smoke.clj

  # The only required check, so that the matrix can change without touching
  # the branch rule.
  ci:
    if: always()
    needs: [lint, test, test-more, connect, xgboost, docs, jar]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
