name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: lint-${{ hashFiles('deps.edn') }}
      - run: clojure -M:kondo --lint src test/zero_one cli test-tmd test-xgb dev build.clj
      - run: clojure -M:fmt check src test cli test-tmd test-xgb docs dev build.clj

  # Every Spark alias on JDK 17 and 21, in two shards each, plus the main
  # alias on arm64 (the closest match to Apple Silicon).
  test:
    name: test (${{ matrix.spark }}, JDK ${{ matrix.java }}, ${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17, 21]
        spark: [spark, spark-3.5-2.13, spark-4]
        shard: [1, 2]
        include:
          - {os: ubuntu-24.04-arm, java: 21, spark: spark, shard: 1}
          - {os: ubuntu-24.04-arm, java: 21, spark: spark, shard: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ matrix.spark }}-${{ hashFiles('deps.edn') }}
          restore-keys: deps-${{ matrix.spark }}-
      - run: clojure -P -T:build
      - run: clojure -P -X:${{ matrix.spark }}:test:cli:tmd
      - run: clojure -T:build prep :spark :${{ matrix.spark }}
      - run: clojure -X:${{ matrix.spark }}:test:cli:tmd :shard '[${{ matrix.shard }} 2]'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.spark }}-${{ matrix.java }}-${{ matrix.os }}-${{ matrix.shard }}
          path: target/test.log

  # The only required check, so that the shards can change without touching
  # the branch rule.
  ci:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
