name: Weekly

# Three checks that don't need to run on every pull request:
#
# - the canary: the suite with Spark's own defaults (code generation on), on
#   the newest patch of each Spark line, and on the newest JDK, and on Spark 4
#   over Spark Connect too. It bumps the Spark pins in deps.edn in its own
#   checkout, so a failure means that the next patch, or the next JDK, would
#   break Geni;
# - the links in the Markdown files, code blocks included, so that a moved
#   dataset shows up here;
# - the cookbook, run as tests on :spark, with its datasets cached.
#
# GitHub emails the last person to touch this file when a scheduled run fails,
# and turns the schedule off after 60 days without commits, so it may need
# re-enabling under Actions.
on:
  schedule:
    - cron: '17 3 * * 1'  # Mondays at 03:17 UTC, 10:17 in Jakarta
  workflow_dispatch:

jobs:
  canary:
    name: canary (${{ matrix.spark }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {spark: spark, java: 21}
          - {spark: spark-4, java: 21}
          - {spark: spark-4, java: 25}
    steps:
      - uses: actions/checkout@v7
      - name: Bump the Spark pins to the newest patches
        run: |
          latest() {
            curl -sSf "https://repo1.maven.org/maven2/org/apache/spark/spark-sql_$1/maven-metadata.xml" \
              | grep -o "<version>$2</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1
          }
          pinned() { grep -o "spark-sql_$1 *{:mvn/version \"$2\"" deps.edn | grep -o '"[^"]*"' | tr -d '"'; }
          old35=$(pinned 2.12 '[^"]*');    new35=$(latest 2.12 '3\.5\.[0-9]*')
          old4=$(pinned 2.13 '4[^"]*');    new4=$(latest 2.13 '4\.[0-9]*\.[0-9]*')
          [ -n "$old35" ] && [ -n "$new35" ] && [ -n "$old4" ] && [ -n "$new4" ] \
            || { echo "Couldn't work out the Spark versions"; exit 1; }
          echo "Spark 3.5: $old35 -> $new35"
          echo "Spark 4:   $old4 -> $new4"
          # The README's setups and the template's too, which readme_test and
          # template_test check against deps.edn.
          sed -i -E "/org\.apache\.spark\//{s/\"$old35\"/\"$new35\"/; s/\"$old4\"/\"$new4\"/}" \
            deps.edn README.md template/resources/zero_one/geni/build/deps.tmpl
          git diff --stat
      - uses: ./.github/actions/test
        with:
          java: ${{ matrix.java }}
          spark: ${{ matrix.spark }}
          aliases: ':cli:tmd:canary'
      # The suite over Spark Connect, on the bumped client and server pins, as
      # ci.yml's connect job runs it. The test action has prepped :spark-4.
      - if: matrix.spark == 'spark-4'
        run: |
          clojure -P -X:spark-4:test:connect-server
          clojure -P -X:spark-connect:test:tmd:connect-arrow
          clojure -T:build connect-tests
      - if: failure() && matrix.spark == 'spark-4'
        uses: actions/upload-artifact@v7
        with:
          name: canary-connect-logs-${{ matrix.java }}
          path: |
            target/test.log
            target/connect-server.log

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # 403 and 429 mostly mean that a site turns bots away, not that the
          # page is gone.
          args: >-
            --no-progress
            --include-verbatim
            --max-retries 3
            --timeout 30
            --accept '100..=103,200..=299,403,429'
            --exclude '^https?://172\.17\.'
            --exclude '^https://clojurians\.slack\.com'
            './**/*.md'

  # Use the same Spark setup as the reference doc tests in ci.yml.
  cookbook:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: docs-${{ hashFiles('deps.edn') }}
          restore-keys: deps-spark-
      # The downloads, which the cookbook skips when they're there already.
      # Part 10's generated data and part 12's checkpoints stay out of it:
      # they're large, and cheap to recreate.
      - uses: actions/cache@v6
        with:
          path: |
            data/cookbook
            !data/cookbook/dummy-retail
            !data/cookbook/checkpoint
          key: cookbook-data-${{ hashFiles('docs/cookbook/*.md') }}
          restore-keys: cookbook-data-
      - run: clojure -T:build prep
      - run: clojure -T:build cookbook
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-cookbook
          path: target/test.log
