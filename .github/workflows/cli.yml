name: CLI

# Builds the Geni CLI uberjar and runs a script through it, directly and with
# scripts/geni. It only runs when the CLI, the script or the build changes, and
# isn't a required check.
on:
  push:
    branches: [develop]
    paths: [cli/**, scripts/geni, build.clj, deps.edn, .github/workflows/cli.yml]
  pull_request:
    paths: [cli/**, scripts/geni, build.clj, deps.edn, .github/workflows/cli.yml]
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uberjar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.12.6.1673
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cli-${{ hashFiles('deps.edn') }}
          restore-keys: deps-
      - run: clojure -T:build cli-uber
      - name: Run a script through the uberjar
        run: |
          cat > smoke.clj <<'CLJ'
          (println "dataframe:" (g/count (g/range 3)))
          (println "rdd:" (rdd/count (rdd/parallelise [1 2 3])))
          CLJ
          java -jar target/geni-repl-uberjar-*.jar smoke.clj 2>&1 | tee smoke.out
          grep -q "dataframe: 3" smoke.out
          grep -q "rdd: 3" smoke.out
          if grep -E " INFO |default log4j profile" smoke.out; then
            echo "The CLI logs at INFO: is its log4j2 config in the uberjar?"
            exit 1
          fi
      - name: Run a script through scripts/geni, online and offline
        run: |
          scripts/geni --help | grep -q "Usage:"
          # A home with a space in it, and the new uberjar under the released
          # version's name, so that the script finds it there.
          export HOME="$RUNNER_TEMP/geni home"
          version=$(curl -fsSL https://raw.githubusercontent.com/zero-one-group/geni/develop/resources/GENI_REPL_RELEASED_VERSION)
          mkdir -p "$HOME/.geni"
          cp target/geni-repl-uberjar-*.jar "$HOME/.geni/geni-repl-uberjar-$version.jar"
          scripts/geni --submit smoke.clj 2>&1 | tee online.out
          grep -q "dataframe: 3" online.out
          # Without GitHub, it runs the uberjar it has.
          mkdir offline && printf '#!/bin/sh\nexit 6\n' > offline/curl && chmod +x offline/curl
          PATH="$PWD/offline:$PATH" scripts/geni --submit smoke.clj 2>&1 | tee offline.out
          grep -q "so running geni-repl-uberjar-$version.jar" offline.out
          grep -q "dataframe: 3" offline.out
